name: Maccabi Haifa Transfer Monitor

on:
  schedule:
    - cron: '*/5 * * * *'    # Every 5 minutes
  workflow_dispatch:           # Manual trigger from GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: 01-מכבי-חיפה-מוניטור
        run: pip install -r requirements.txt

      - name: Restore seen items cache
        uses: actions/cache@v4
        with:
          path: 01-מכבי-חיפה-מוניטור/seen_items.json
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Run monitor (single cycle)
        working-directory: 01-מכבי-חיפה-מוניטור
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python run_once.py

      - name: Save seen items cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: 01-מכבי-חיפה-מוניטור/seen_items.json
          key: seen-items-${{ github.run_id }}
